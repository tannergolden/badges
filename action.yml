#
# The action metadata lives at the repository ROOT because GitHub Marketplace
# requires it there, and because `uses: tannergolden/badges@v1` is the
# shortest thing a consumer has to type.
name: 'Badges'
description: >-
  Render committed SVG badges from a data file and localize shields.io
  hotlinks in Markdown. Stdlib Python only, no third-party badge service.
author: 'Tanner Golden'
branding:
  icon: 'tag'
  color: 'purple'

inputs:
  mode:
    description: >-
      render   - render badges.yml into committed SVGs (default)
      check    - verify committed SVGs are current and no shields.io hotlink
                 remains, write nothing
      localize - rewrite shields.io hotlinks in Markdown into committed SVGs
      all      - localize, then render
      snippets - print a ready-to-paste Markdown embed line per badge to the
                 log and the job summary, write nothing
    required: false
    default: 'render'
  data:
    description: 'Badge data file, relative to the repository root.'
    required: false
    default: '.github/badges.yml'
  out:
    description: 'Output directory for committed SVGs, relative to the repository root.'
    required: false
    default: 'assets/badges'
  set:
    description: >-
      Newline-separated NAME=MESSAGE[:COLOR] updates applied to the data file
      before rendering, e.g. "build=Passing:green". Ignored in check mode.
    required: false
    default: ''
  theme:
    description: >-
      The print every static plate is drawn in, instead of the one it names:
      blueprint, redprint, orangeprint, yellowprint, greenprint, tealprint,
      indigoprint, purpleprint, pinkprint, brownprint, blackprint, or
      rainbowprint to follow the colour the page's banners are in. A live
      plate keeps its state's print and a classic badge its colours. Empty:
      each plate's own print. The Markdown workflow passes its theme here.
    required: false
    default: ''
  randomize-seed:
    description: >-
      Recolor decorative static badges from the non-status palette, keyed by
      this seed. Pass an ISO week ($(date -u +%GW%V)) to rotate weekly.
      Empty means no rotation.
    required: false
    default: ''
  commit:
    description: >-
      'true' stages what the run changed, commits it, and pushes to the
      branch that was checked out, so the workflow needs no git steps of its
      own. The commit is AUTHORED by the kit's author and committed by the
      workflow that ran it (github-actions[bot]); the README says why. Needs
      `contents: write` on the job and a checkout that kept its token, which
      is the actions/checkout default. Ignored in check and snippets modes,
      which write nothing.
    required: false
    default: 'false'
  commit-message:
    description: >-
      Subject line of that commit. Empty picks one for the mode, e.g.
      "chore(badges): 🏷️ re-render badges". The body is written by the kit
      and records the mode, the data file, and a link to the run.
    required: false
    default: ''

outputs:
  changed:
    description: "'true' when the run modified any tracked file."
    value: ${{ steps.run.outputs.changed }}
  commit:
    description: 'The SHA of the commit the run pushed, or empty when it made none.'
    value: ${{ steps.run.outputs.commit }}

runs:
  using: 'composite'
  steps:
    # No setup-python step on purpose: the kit is stdlib-only (PyYAML is used
    # when present and a built-in reader substitutes when it is not), and
    # every GitHub-hosted runner ships python3. Nothing to install, nothing
    # to cache, nothing to rate-limit.
    - id: run
      shell: bash
      # Inputs travel through env, never interpolated into the script body -
      # a ${{ }} expansion inside `run:` is a shell-injection sink.
      env:
        KIT_MODE: ${{ inputs.mode }}
        KIT_DATA: ${{ inputs.data }}
        KIT_OUT: ${{ inputs.out }}
        KIT_SET: ${{ inputs.set }}
        KIT_SEED: ${{ inputs.randomize-seed }}
        KIT_THEME: ${{ inputs.theme }}
        KIT_COMMIT: ${{ inputs.commit }}
        KIT_MESSAGE: ${{ inputs.commit-message }}
        KIT_PATH: ${{ github.action_path }}
        # Who a generated commit is by. The badges are the kit's output, not
        # something the consumer's workflow wrote, so the kit's AUTHOR is the
        # author of the commit that carries them, and the workflow that ran
        # the kit is the COMMITTER: the history then says both who drew the
        # badges and what pushed them. The noreply addresses are the ones
        # GitHub resolves to the account and to the Actions bot.
        KIT_AUTHOR: 'Tanner Golden <24684994+tannergolden@users.noreply.github.com>'
        KIT_COMMITTER_NAME: 'github-actions[bot]'
        KIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
      run: |
        set -euo pipefail
        case "$KIT_MODE" in
          render|check|localize|all|snippets) ;;
          *) echo "::error::unknown mode '$KIT_MODE' (render|check|localize|all|snippets)"; exit 1 ;;
        esac

        # Every hosted runner ships an interpreter, but not under one name:
        # python3 on Linux and macOS, plain python in Git Bash on Windows.
        PY="$(command -v python3 || command -v python || true)"
        if [ -z "$PY" ]; then
          echo "::error::no python3 or python on PATH"; exit 1
        fi

        root="$GITHUB_WORKSPACE"
        data="$root/$KIT_DATA"
        out="$root/$KIT_OUT"
        # --untracked-files=all: the default collapses a new directory to one
        # "?? dir/" line, so a second badge rendered into it would read as
        # "nothing changed". Read NUL-separated so no path is ever quoted;
        # a newline inside a filename is the one thing this cannot carry, and
        # no badge tree has one.
        snapshot() {
          git -C "$root" status --porcelain=v1 -z --untracked-files=all 2>/dev/null | tr '\0' '\n' || true
        }
        before="$(snapshot)"

        # The codemod goes first: in localize/all it may create badges the
        # renderer then reserves, and in check mode it is the hotlink gate.
        # It receives the same tree as the renderer, so a custom data/out
        # is honoured on both sides.
        case "$KIT_MODE" in
          localize|all|check)
            loc=( --root "$root" --data "$data" --out "$out" )
            if [ "$KIT_MODE" = "check" ]; then loc+=( --check ); fi
            "$PY" "$KIT_PATH/src/localize-badges.py" "${loc[@]}"
            ;;
        esac

        if [ "$KIT_MODE" != "localize" ]; then
          args=( --root "$root" --data "$data" --out "$out" )
          case "$KIT_MODE" in
            check)    args+=( --check ) ;;
            snippets) args+=( --markdown ) ;;
            *)
              while IFS= read -r line; do
                if [ -n "$line" ]; then args+=( --set "$line" ); fi
              done <<< "$KIT_SET"
              if [ -n "$KIT_SEED" ]; then args+=( --randomize-static "$KIT_SEED" ); fi
              ;;
          esac
          # The theme reaches check mode too, so a check compares against what render drew.
          if [ -n "$KIT_THEME" ]; then args+=( --theme "$KIT_THEME" ); fi
          if [ "$KIT_MODE" = "snippets" ]; then
            snippets="$("$PY" "$KIT_PATH/src/badge-kit.py" "${args[@]}")"
            printf '%s\n' "$snippets"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### Badge embed snippets"
                echo
                echo '```markdown'
                printf '%s\n' "$snippets"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            "$PY" "$KIT_PATH/src/badge-kit.py" "${args[@]}"
          fi
        fi

        after="$(snapshot)"
        if [ "$before" != "$after" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

        # Commit and push what THIS run changed, as the kit's author.
        sha=""
        if [ "$KIT_COMMIT" = "true" ] && [ "$KIT_MODE" != "check" ] && [ "$KIT_MODE" != "snippets" ] && [ "$before" != "$after" ]; then
          branch="$(git -C "$root" symbolic-ref --quiet --short HEAD || true)"
          if [ -z "$branch" ]; then
            echo "::error::commit: the checkout is not on a branch, so there is nowhere to push. Check out the branch to update; a pull_request checkout is a detached merge commit."
            exit 1
          fi
          # Only the paths whose status THIS run changed are staged, never
          # whatever the checkout was already carrying, so the commit is the
          # kit's output and nothing else. A path that was already modified
          # before the run keeps its status line and is left alone.
          mapfile -t paths < <(
            comm -13 <(printf '%s\n' "$before" | LC_ALL=C sort) <(printf '%s\n' "$after" | LC_ALL=C sort) \
              | grep -E '^[ MADRCUT?!]{2} ' | cut -c4-
          )
          if [ "${#paths[@]}" -gt 0 ]; then
            git -C "$root" add -A -- "${paths[@]}"
          fi
          if git -C "$root" diff --cached --quiet; then
            echo "Nothing to commit."
          else
            subject="$KIT_MESSAGE"
            if [ -z "$subject" ]; then
              case "$KIT_MODE" in
                localize) subject='chore(badges): 🏷️ localize shields.io badges' ;;
                all)      subject='chore(badges): 🏷️ localize and re-render badges' ;;
                *)        subject='chore(badges): 🏷️ re-render badges' ;;
              esac
            fi
            version="$("$PY" "$KIT_PATH/src/badge-kit.py" --version)"
            body="$(printf 'Drawn by tannergolden/badges (%s), mode %s, from\n%s into %s, by the "%s" workflow:\n%s/%s/actions/runs/%s' \
              "$version" "$KIT_MODE" "$KIT_DATA" "$KIT_OUT" "${GITHUB_WORKFLOW:-}" \
              "${GITHUB_SERVER_URL:-https://github.com}" "${GITHUB_REPOSITORY:-}" "${GITHUB_RUN_ID:-}")"
            git -C "$root" -c commit.gpgsign=false \
              -c user.name="$KIT_COMMITTER_NAME" -c user.email="$KIT_COMMITTER_EMAIL" \
              commit --quiet --author="$KIT_AUTHOR" -m "$subject" -m "$body"
            sha="$(git -C "$root" rev-parse HEAD)"
            git -C "$root" push --quiet origin "HEAD:refs/heads/$branch"
            echo "Committed and pushed $sha to $branch, authored by ${KIT_AUTHOR%% <*}."
          fi
        fi
        echo "commit=$sha" >> "$GITHUB_OUTPUT"
