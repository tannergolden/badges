  # --- Blueprint plates --------------------------------------------------------
  # The same badges drawn like tannergolden/banners. A static plate is drawn
  # in its `print` and writes a day and a night file (<name>.svg and
  # <name>-dark.svg, embedded together with <picture>); it takes no
  # message_color. A live plate is a gold label, drawn in its state's print,
  # one file; `reserve` sizes it for its widest value so it never changes width.
  - name: plate-release
    label: Release
    message: v2.4.0
    icon: tag
    style: blueprint-for-the-badge
    print: redprint
  - name: plate-bundle
